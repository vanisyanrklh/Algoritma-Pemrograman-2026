<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuangKu sudah pindah</title>
    <meta http-equiv="refresh" content="0; url=https://vanisyanrklh.github.io/belajar-volume-kubus-balok/" />
    <link rel="canonical" href="https://vanisyanrklh.github.io/belajar-volume-kubus-balok/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff6ec; color: #2b211b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 16px; }
      a { display: inline-block; margin-top: 12px; padding: 14px 24px; border-radius: 999px; background: #cf4430;
        color: #fff; font-weight: 700; text-decoration: none; }
    </style>
    <script>
      // Hapus aplikasi versi lama yang tersimpan (service worker & cache), lalu pindah ke link baru.
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (window.caches) {
            const kunci = await caches.keys();
            await Promise.all(kunci.map((k) => caches.delete(k)));
          }
        } catch (e) { /* abaikan */ }
        location.replace('https://vanisyanrklh.github.io/belajar-volume-kubus-balok/' + location.hash);
      })();
    </script>
  </head>
  <body>
    <div>
      <p><strong>RuangKu sudah pindah ke alamat baru.</strong></p>
      <a href="https://vanisyanrklh.github.io/belajar-volume-kubus-balok/">Buka RuangKu</a>
    </div>
  </body>
</html>
